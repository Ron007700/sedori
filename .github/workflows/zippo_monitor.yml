name: ZIPPO Monitor

on:
  schedule:
    # 日本時間 17:00〜22:00 (UTC 8:00〜13:00) のピークタイムを中心に20分おきに実行
    - cron: '*/20 8-13 * * *'
  workflow_dispatch: # Actionsタブからの手動実行ボタン

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          ref: master
          path: .

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium beautifulsoup4 requests google-generativeai

      - name: Run ZIPPO Monitor Script
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          pwd
          ls -la
          python zippo_monitor.py

      - name: Commit and push changes (seen_zippo.json)
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add seen_zippo.json || true
          git commit -m "Update seen ZIPPO IDs" || exit 0
          git push
