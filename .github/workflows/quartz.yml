name: Quartz Watch Research

on:
  schedule:
    # JST 17:22, 19:18, 20:22, 20:52 (UTC 08:22, 10:18, 11:22, 11:52)
    - cron: '22 8,11 * * *'
    - cron: '18 10 * * *'
    - cron: '52 11 * * *'
  workflow_dispatch: # 手動実行用

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright beautifulsoup4 requests google-genai pillow
          playwright install --with-deps chromium

      - name: Run Quartz Research Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python quartz_research.py

      - name: Commit and push updated seen_quartz.json
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add seen_quartz.json
          git commit -m "Update seen quartz items [skip ci]" || exit 0
          git push
