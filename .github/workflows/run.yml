name: run-research

on:
  schedule:
    # 日本時間 19:03, 20:33, 21:03 （UTC 10:03, 11:33, 12:03）
    - cron: '3 10 * * *'
    - cron: '33 11 * * *'
    - cron: '3 12 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai requests beautifulsoup4 pillow selenium webdriver-manager

      - name: Run script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python main.py
