name: run-research

on:
  schedule:
    - cron: '3 10 * * *'   # UTC 10:03 = 日本時間 19:03
    - cron: '33 11 * * *'  # UTC 11:33 = 日本時間 20:33
    - cron: '3 12 * * *'   # UTC 12:03 = 日本時間 21:03
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai requests beautifulsoup4 pillow playwright
          playwright install --with-deps chromium

      - name: Run script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python main.py

      - name: 重複チェック用ファイルの自動更新・コミット
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_solar.json || true
          git commit -m "Update seen_solar.json" || true
          git push || true
