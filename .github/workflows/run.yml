name: run-research

on:
  schedule:
    # 日本時間 19:00, 20:30, 21:00 に自動実行（UTC 10:00, 11:30, 12:00）
    - cron: '0 10 * * *'
    - cron: '30 11 * * *'
    - cron: '0 12 * * *'
  workflow_dispatch: # 手動実行用ボタン

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai requests beautifulsoup4 pillow selenium webdriver-manager

      - name: Run script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python main.py
