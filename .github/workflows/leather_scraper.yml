name: Run Yahoo Leather Scraper

on:
  schedule:
    - cron: '17 8 * * *'   # 日本時間 17:17 (UTC 08:17)
    - cron: '57 9 * * *'   # 日本時間 18:57 (UTC 09:57)
    - cron: '47 10 * * *'  # 日本時間 19:47 (UTC 10:47)
    - cron: '37 11 * * *'  # 日本時間 20:37 (UTC 11:37)
  workflow_dispatch:

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: Python環境のセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 依存ライブラリとPlaywrightのインストール
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 playwright pillow google-genai
          playwright install --with-deps chromium

      - name: スクレイピング実行
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python leather_scraper.py

      - name: 重複チェック用ファイルの自動更新・コミット
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_leather.json || true
          git diff --staged --quiet || (git commit -m "Update seen leather items" && git push)
